      - run: node scripts/attendance-setup-ux-smoke.mjs
      - run: node scripts/biometric-enrollment-approval-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/phase9-maintenance-operation-smoke.mjs
      - run: node scripts/maintenance-executor-assignment-smoke.mjs
      - run: node scripts/maintenance-server-pagination-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/work-orders-server-pagination-smoke.mjs
