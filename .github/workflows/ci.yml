name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cmms
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmms -d cmms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run migrate
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/dashboard-sql-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/inventory-kardex-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/inventory-i2a2-transaction-integrity-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/inventory-kardex-server-pagination-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/inventory-scope-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/inventory-server-pagination-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/unified-inventory-import-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/requisition-receipt-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/requisition-approval-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/supplier-analytics-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/supplier-return-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/procurement-reconciliation-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/design-system-smoke.mjs
      - run: node scripts/ui-kit-core-smoke.mjs
      - run: node scripts/header-tooltip-regression-smoke.mjs
      - run: node scripts/shell-v2-smoke.mjs
      - run: node scripts/data-ui-smoke.mjs
      - run: node scripts/view-mode-toggle-smoke.mjs
      - run: node scripts/performance-p1-smoke.mjs
      - run: node scripts/performance-suppliers-phase2-smoke.mjs
      - run: node scripts/business-ui-smoke.mjs
      - run: node scripts/phase6-modules-smoke.mjs
      - run: node scripts/company-documents-fullwidth-smoke.mjs
      - run: node scripts/phase7-assets-inventory-smoke.mjs
      - run: node scripts/assets-independent-views-smoke.mjs
      - run: node scripts/assets-import-reconciliation-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/inventory-independent-views-smoke.mjs
      - run: node scripts/phase8-suppliers-people-smoke.mjs
      - run: node scripts/crew-directory-redesign-smoke.mjs
