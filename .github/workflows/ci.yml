      - run: node scripts/self-biometric-enrollment-smoke.mjs
      - run: node scripts/brand-personalization-smoke.mjs
      - run: node scripts/design-system-final-audit.mjs
      - run: npm run build
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
          APP_ADMIN_PASSWORD: ci-password
          AUTH_SECRET: ci-secret-not-for-production
      - run: node scripts/performance-build-report.mjs
