name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cmms
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmms -d cmms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run migrate
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/dashboard-sql-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/inventory-kardex-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/requisition-receipt-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/requisition-approval-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/supplier-analytics-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: node scripts/supplier-return-smoke.mjs
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
      - run: npm run build
        env:
          DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms
          APP_ADMIN_PASSWORD: ci-password
          AUTH_SECRET: ci-secret-not-for-production
